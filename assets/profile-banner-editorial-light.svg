<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title description">
  <title id="title">Marin Jursic</title>
  <desc id="description">Senior Full-Stack Engineer building reliable software from architecture to production</desc>
  <defs>
    <linearGradient id="brandRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="wash" cx="100%" cy="0%" r="72%">
      <stop offset="0" stop-color="#dbeafe" stop-opacity=".72"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="250" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="250" fill="#f8fafc"/>
    <rect width="1200" height="250" fill="url(#wash)"/>
    <rect width="1200" height="6" fill="url(#brandRule)"/>

    <text x="64" y="50" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SOFTWARE ENGINEERING · CONSULTING</text>
    <text x="64" y="117" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.1">Marin Jursic</text>
    <text x="64" y="162" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600">Senior Full-Stack Engineer</text>
    <text x="64" y="207" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500">Product architecture · Full-stack delivery · Data systems</text>

    <rect x=".5" y=".5" width="1199" height="249" rx="13.5" fill="none" stroke="#d8e0ea"/>
  </g>
</svg>
